<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原物料調價衝擊分析預警系統</title>
  <!-- 引入 Tailwind CSS (樣式庫) 與 SheetJS (Excel解析匯出庫) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">原物料採購核價 ➔ 成品調價預警分析工具</h1>
        <p class="text-sm text-slate-500 mt-1">方案二架構：舊核價價差 ➔ 舊 BOM 用量反查 ➔ 新主件料號對照 ➔ 自動匯總每台成本增加額</p>
      </div>
      <div class="flex gap-2">
        <button id="loadMockBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition border border-slate-300">
          📥 載入模擬展示資料
        </button>
        <button id="exportBtn" disabled class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-sm font-medium rounded-lg transition shadow-sm">
          📊 匯出分析結果 Excel
        </button>
      </div>
    </header>

    <!-- 檔案上傳與動態欄位對應區塊 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- 檔案 1: 採購核價單 -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">1</span>
          <h2 class="font-semibold text-slate-800">舊採購核價單</h2>
        </div>
        <input type="file" id="filePrice" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-3 cursor-pointer">
        
        <div id="mappingPrice" class="space-y-2 text-xs hidden mt-auto pt-3 border-t border-slate-100">
          <div><label class="text-slate-500 font-medium">舊原物料料號：</label><select id="col_rm_no" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">上次採購單價：</label><select id="col_old_price" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">本次核定單價：</label><select id="col_new_price" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
        </div>
      </div>

      <!-- 檔案 2: 舊 BOM 用量表 -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-6 h-6 rounded-full bg-amber-600 text-white flex items-center justify-center text-xs font-bold">2</span>
          <h2 class="font-semibold text-slate-800">舊 BOM 用量表 (Where-Used)</h2>
        </div>
        <input type="file" id="fileBom" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 mb-3 cursor-pointer">
        
        <div id="mappingBom" class="space-y-2 text-xs hidden mt-auto pt-3 border-t border-slate-100">
          <div><label class="text-slate-500 font-medium">舊成品/主件料號：</label><select id="col_bom_parent" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">子件/原物料料號：</label><select id="col_bom_child" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">單位標準用量：</label><select id="col_bom_qty" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
        </div>
      </div>

      <!-- 檔案 3: 新舊主件對照表 -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold">3</span>
          <h2 class="font-semibold text-slate-800">新舊主件對照檔</h2>
        </div>
        <input type="file" id="fileMap" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 mb-3 cursor-pointer">
        
        <div id="mappingMap" class="space-y-2 text-xs hidden mt-auto pt-3 border-t border-slate-100">
          <div><label class="text-slate-500 font-medium">舊主件料號：</label><select id="col_map_old" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">新主件料號：</label><select id="col_map_new" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">新主件品名規格 (選填)：</label><select id="col_map_name" class="w-full mt-1 border rounded p-1 bg-slate-50"></select></div>
        </div>
      </div>
    </div>

    <!-- 執行計算按鈕 -->
    <div class="text-center">
      <button id="calcBtn" class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition transform active:scale-95">
        🚀 開始計算物料漲幅衝擊
      </button>
    </div>

    <!-- 統計卡片 -->
    <div id="statsSection" class="grid grid-cols-1 md:grid-cols-4 gap-4 hidden">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">受影響新主件數</div>
        <div id="statTotalProducts" class="text-2xl font-bold text-slate-800 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">漲價原物料項目數</div>
        <div id="statTotalMaterials" class="text-2xl font-bold text-blue-600 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">最高單台成本增加額</div>
        <div id="statMaxImpact" class="text-2xl font-bold text-rose-600 mt-1">$0.00</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">未對照新料號舊主件數</div>
        <div id="statUnmapped" class="text-2xl font-bold text-amber-500 mt-1">0</div>
      </div>
    </div>

    <!-- 查詢過濾與結果列表 -->
    <div id="resultCard" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hidden">
      <div class="p-4 border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-3">
        <h2 class="font-bold text-slate-800">受調價影響之新系統成品主件列表</h2>
        <div class="flex items-center gap-2 w-full md:w-auto">
          <input type="text" id="searchInput" placeholder="搜尋新舊料號、品名..." class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64">
          <select id="filterLevel" class="text-sm border border-slate-300 rounded-lg px-2 py-1.5 bg-white">
            <option value="ALL">全部顯示</option>
            <option value="HIGH">高衝擊 (&gt; $5.0)</option>
            <option value="MID">中衝擊 ($1.0 ~ $5.0)</option>
            <option value="LOW">低衝擊 (&lt; $1.0)</option>
          </select>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
              <th class="p-3 w-12 text-center">明細</th>
              <th class="p-3">新系統主件料號</th>
              <th class="p-3">新主件品名規格</th>
              <th class="p-3">對應舊主件</th>
              <th class="p-3 text-center">波及原物料數</th>
              <th class="p-3 text-right">單台成本增加 (ΔCost)</th>
              <th class="p-3 text-center">預警等級</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 儲存原始資料陣列
    let rawPriceData = [], rawBomData = [], rawMapData = [];
    let calculatedResults = [];

    // 通用輔助：讀取 Excel
    function handleFileUpload(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        callback(json);
      };
      reader.readAsArrayBuffer(file);
    }

    // 自動填充欄位下拉選單
    function populateDropdown(selectId, headers, keywords) {
      const select = document.getElementById(selectId);
      select.innerHTML = '<option value="">-- 請選擇欄位 --</option>';
      let matchedIndex = -1;

      headers.forEach((h, index) => {
        if (!h) return;
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${h} (欄位 ${index + 1})`;
        select.appendChild(opt);

        // 智慧關鍵字模糊比對
        if (matchedIndex === -1 && keywords.some(k => String(h).toLowerCase().includes(k))) {
          matchedIndex = index;
        }
      });

      if (matchedIndex !== -1) select.value = matchedIndex;
    }

    // 監聽 3 份檔案上傳
    document.getElementById('filePrice').addEventListener('change', (e) => {
      handleFileUpload(e.target.files[0], (rows) => {
        rawPriceData = rows;
        const headers = rows[0] || [];
        populateDropdown('col_rm_no', headers, ['料號', '物料', '零件', 'item', 'rm']);
        populateDropdown('col_old_price', headers, ['上次', '原單價', '舊價', 'old', 'last']);
        populateDropdown('col_new_price', headers, ['本次', '新單價', '核價', 'new', 'price']);
        document.getElementById('mappingPrice').classList.remove('hidden');
      });
    });

    document.getElementById('fileBom').addEventListener('change', (e) => {
      handleFileUpload(e.target.files[0], (rows) => {
        rawBomData = rows;
        const headers = rows[0] || [];
        populateDropdown('col_bom_parent', headers, ['主件', '主料', '母件', '成品', 'parent']);
        populateDropdown('col_bom_child', headers, ['子件', '材料', '元件', 'child', 'component']);
        populateDropdown('col_bom_qty', headers, ['用量', '數量', 'qty', 'quantity']);
        document.getElementById('mappingBom').classList.remove('hidden');
      });
    });

    document.getElementById('fileMap').addEventListener('change', (e) => {
      handleFileUpload(e.target.files[0], (rows) => {
        rawMapData = rows;
        const headers = rows[0] || [];
        populateDropdown('col_map_old', headers, ['舊', 'old']);
        populateDropdown('col_map_new', headers, ['新', 'new']);
        populateDropdown('col_map_name', headers, ['品名', '規格', '說明', 'name', 'desc']);
        document.getElementById('mappingMap').classList.remove('hidden');
      });
    });

    // 核心計算邏輯
    function runAnalysis() {
      // 1. 取得設定之欄位索引
      const idxRm = document.getElementById('col_rm_no').value;
      const idxOldP = document.getElementById('col_old_price').value;
      const idxNewP = document.getElementById('col_new_price').value;

      const idxParent = document.getElementById('col_bom_parent').value;
      const idxChild = document.getElementById('col_bom_child').value;
      const idxQty = document.getElementById('col_bom_qty').value;

      const idxMapOld = document.getElementById('col_map_old').value;
      const idxMapNew = document.getElementById('col_map_new').value;
      const idxMapName = document.getElementById('col_map_name').value;

      if (!idxRm || !idxOldP || !idxNewP || !idxParent || !idxChild || !idxQty || !idxMapOld || !idxMapNew) {
        alert('請確認三份檔案的所有必填對照欄位皆已選定！');
        return;
      }

      // 2. 建立核價價差 Map (只留下調漲的料件)
      const priceDiffMap = new Map();
      for (let i = 1; i < rawPriceData.length; i++) {
        const row = rawPriceData[i];
        const rmCode = String(row[idxRm] || '').trim();
        const oldP = parseFloat(row[idxOldP]) || 0;
        const newP = parseFloat(row[idxNewP]) || 0;
        const diff = newP - oldP;

        if (rmCode && diff > 0) {
          priceDiffMap.set(rmCode, { oldPrice: oldP, newPrice: newP, diff: diff });
        }
      }

      // 3. 建立新舊成品對照 Map
      const productMap = new Map();
      for (let i = 1; i < rawMapData.length; i++) {
        const row = rawMapData[i];
        const oldCode = String(row[idxMapOld] || '').trim();
        const newCode = String(row[idxMapNew] || '').trim();
        const newName = idxMapName !== "" ? String(row[idxMapName] || '').trim() : '未命名規格';

        if (oldCode) {
          productMap.set(oldCode, { newCode: newCode || '未對照', newName: newName });
        }
      }

      // 4. 串接 BOM 進行 Where-Used 累積
      const summaryMap = new Map();

      for (let i = 1; i < rawBomData.length; i++) {
        const row = rawBomData[i];
        const parentCode = String(row[idxParent] || '').trim();
        const childCode = String(row[idxChild] || '').trim();
        const qty = parseFloat(row[idxQty]) || 0;

        if (!parentCode || !childCode || qty <= 0) continue;

        // 檢查該子件是否有調漲
        if (priceDiffMap.has(childCode)) {
          const rmInfo = priceDiffMap.get(childCode);
          const impact = rmInfo.diff * qty;

          if (!summaryMap.has(parentCode)) {
            const mappedProd = productMap.get(parentCode) || { newCode: '【未建立對照】', newName: '查無新系統對照品名' };
            summaryMap.set(parentCode, {
              oldParent: parentCode,
              newParent: mappedProd.newCode,
              newName: mappedProd.newName,
              totalCostIncrease: 0,
              materials: []
            });
          }

          const target = summaryMap.get(parentCode);
          target.totalCostIncrease += impact;
          target.materials.push({
            rmCode: childCode,
            oldPrice: rmInfo.oldPrice,
            newPrice: rmInfo.newPrice,
            diff: rmInfo.diff,
            qty: qty,
            impact: impact
          });
        }
      }

      calculatedResults = Array.from(summaryMap.values());
      calculatedResults.sort((a, b) => b.totalCostIncrease - a.totalCostIncrease);

      renderResults();
    }

    // 渲染報表與統計儀表
    function renderResults() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const filterLvl = document.getElementById('filterLevel').value;

      let totalAffected = 0;
      let maxCost = 0;
      let unmappedCount = 0;

      calculatedResults.forEach((item, index) => {
        // 搜尋過濾
        const matchSearch = item.newParent.toLowerCase().includes(searchVal) ||
                            item.oldParent.toLowerCase().includes(searchVal) ||
                            item.newName.toLowerCase().includes(searchVal);

        let level = 'LOW';
        if (item.totalCostIncrease >= 5.0) level = 'HIGH';
        else if (item.totalCostIncrease >= 1.0) level = 'MID';

        const matchLevel = filterLvl === 'ALL' || filterLvl === level;

        if (item.newParent.includes('未建立對照')) unmappedCount++;
        if (item.totalCostIncrease > maxCost) maxCost = item.totalCostIncrease;
        totalAffected++;

        if (!matchSearch || !matchLevel) return;

        // 警示標籤樣式
        let badge = '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800">低衝擊</span>';
        if (level === 'HIGH') badge = '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-rose-100 text-rose-800 animate-pulse">🚨 高衝擊</span>';
        else if (level === 'MID') badge = '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800">⚠️ 中衝擊</span>';

        // 主列
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition border-b border-slate-100 cursor-pointer";
        tr.onclick = () => toggleDetail(index);
        tr.innerHTML = `
          <td class="p-3 text-center text-slate-400 font-bold" id="icon-${index}">▶</td>
          <td class="p-3 font-semibold ${item.newParent.includes('未建立') ? 'text-amber-600' : 'text-blue-600'}">${item.newParent}</td>
          <td class="p-3 text-slate-700">${item.newName}</td>
          <td class="p-3 font-mono text-slate-500">${item.oldParent}</td>
          <td class="p-3 text-center"><span class="px-2 py-0.5 bg-slate-100 rounded-full text-xs font-medium">${item.materials.length} 顆</span></td>
          <td class="p-3 text-right font-mono font-bold text-rose-600">+$${item.totalCostIncrease.toFixed(4)}</td>
          <td class="p-3 text-center">${badge}</td>
        `;
        tbody.appendChild(tr);

        // 展開明細列
        const trDetail = document.createElement('tr');
        trDetail.id = `detail-${index}`;
        trDetail.className = "hidden bg-slate-50 border-b border-slate-200";
        let subRows = item.materials.map(m => `
          <tr class="border-b border-slate-200 text-xs text-slate-600">
            <td class="p-2 font-mono">${m.rmCode}</td>
            <td class="p-2 text-right">$${m.oldPrice.toFixed(2)}</td>
            <td class="p-2 text-right">$${m.newPrice.toFixed(2)}</td>
            <td class="p-2 text-right font-semibold text-rose-600">+$${m.diff.toFixed(2)}</td>
            <td class="p-2 text-center">${m.qty}</td>
            <td class="p-2 text-right font-mono font-bold text-slate-900">+$${m.impact.toFixed(4)}</td>
          </tr>
        `).join('');

        trDetail.innerHTML = `
          <td colspan="7" class="p-4">
            <div class="bg-white rounded-lg border border-slate-200 p-3 shadow-inner">
              <div class="text-xs font-bold text-slate-700 mb-2">調價原物料清單與單位衝擊：</div>
              <table class="w-full text-left">
                <thead>
                  <tr class="text-xs text-slate-400 border-b border-slate-200">
                    <th class="p-1">調價物料料號</th>
                    <th class="p-1 text-right">上次單價</th>
                    <th class="p-1 text-right">本次核價</th>
                    <th class="p-1 text-right">物料價差</th>
                    <th class="p-1 text-center">用量 (Qty)</th>
                    <th class="p-1 text-right">單件成本增加額</th>
                  </tr>
                </thead>
                <tbody>${subRows}</tbody>
              </table>
            </div>
          </td>
        `;
        tbody.appendChild(trDetail);
      });

      // 更新卡片統計
      document.getElementById('statTotalProducts').textContent = totalAffected;
      document.getElementById('statTotalMaterials').textContent = document.getElementById('mappingPrice').classList.contains('hidden') ? 0 : (rawPriceData.length - 1);
      document.getElementById('statMaxImpact').textContent = `$${maxCost.toFixed(2)}`;
      document.getElementById('statUnmapped').textContent = unmappedCount;

      document.getElementById('statsSection').classList.remove('hidden');
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('exportBtn').disabled = false;
    }

    function toggleDetail(index) {
      const detailRow = document.getElementById(`detail-${index}`);
      const icon = document.getElementById(`icon-${index}`);
      if (detailRow.classList.contains('hidden')) {
        detailRow.classList.remove('hidden');
        icon.textContent = '▼';
      } else {
        detailRow.classList.add('hidden');
        icon.textContent = '▶';
      }
    }

    // 匯出 Excel
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (calculatedResults.length === 0) return;

      const exportRows = [];
      calculatedResults.forEach(prod => {
        prod.materials.forEach(mat => {
          exportRows.push({
            '新主件料號': prod.newParent,
            '新主件品名規格': prod.newName,
            '舊主件料號': prod.oldParent,
            '單台總成本增加': prod.totalCostIncrease,
            '調價原物料號': mat.rmCode,
            '上次原價': mat.oldPrice,
            '本次核價': mat.newPrice,
            '原物料價差': mat.diff,
            '單位用量': mat.qty,
            '此材料成本貢獻': mat.impact
          });
        });
      });

      const ws = XLSX.utils.json_to_sheet(exportRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "物料漲價主件衝擊分析");
      XLSX.writeFile(wb, `原物料調價衝擊預警表_${new Date().toISOString().slice(0,10)}.xlsx`);
    });

    // 模擬展示資料按鈕
    document.getElementById('loadMockBtn').addEventListener('click', () => {
      rawPriceData = [
        ['原物料舊料號', '物料名稱', '上次單價', '本次核價'],
        ['RM-101', '電解電容 220uF', 2.50, 3.20],
