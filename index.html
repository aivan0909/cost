<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原物料調價衝擊分析預警系統 (W-前綴自動對照版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">

  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">原物料採購核價 ➔ 成品調價衝擊分析預警系統</h1>
        <p class="text-sm text-slate-500 mt-1">支援 BOM 多工作表彙整、自動忽略 W-/w- 前綴差異精準對照、期末庫存與上次單價雙軌比對</p>
      </div>
      <div class="flex gap-2">
        <button id="exportBtn" disabled class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-sm font-semibold rounded-lg transition shadow-sm flex items-center gap-2">
          <span>📊</span> 匯出管理者決策 Excel (多分頁)
        </button>
      </div>
    </header>

    <!-- 檔案上傳與欄位指定 (4個檔案區塊) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      <!-- 檔案 1: 採購核價單 -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">1</span>
          <h2 class="font-semibold text-sm text-slate-800">舊採購核價單</h2>
        </div>
        <input type="file" id="filePrice" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-2 cursor-pointer">
        <div id="priceSheetInfo" class="text-[11px] text-blue-600 font-medium hidden mb-1"></div>
        <div id="mappingPrice" class="space-y-1.5 text-xs hidden mt-auto pt-2 border-t border-slate-100">
          <div><label class="text-slate-500 font-medium">原物料料號：</label><select id="col_rm_no" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">上次採購單價：</label><select id="col_old_price" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">本次核定單價：</label><select id="col_new_price" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
        </div>
      </div>

      <!-- 檔案 2: 庫存單價表 (選填) -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-6 h-6 rounded-full bg-purple-600 text-white flex items-center justify-center text-xs font-bold">2</span>
          <h2 class="font-semibold text-sm text-slate-800">期末庫存單價檔 (選填)</h2>
        </div>
        <input type="file" id="fileStock" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 mb-2 cursor-pointer">
        <div id="stockSheetInfo" class="text-[11px] text-purple-600 font-medium hidden mb-1"></div>
        <div id="mappingStock" class="space-y-1.5 text-xs hidden mt-auto pt-2 border-t border-slate-100">
          <div><label class="text-slate-500 font-medium">庫存原物料料號：</label><select id="col_stock_no" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">期末庫存單價：</label><select id="col_stock_price" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
          <p class="text-[10px] text-slate-400">※ 當上次單價為 0 時，以此庫存單價作為基準比對</p>
        </div>
      </div>

      <!-- 檔案 3: 舊 BOM 用量表 (多 Sheet) -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-6 h-6 rounded-full bg-amber-600 text-white flex items-center justify-center text-xs font-bold">3</span>
          <h2 class="font-semibold text-sm text-slate-800">舊 BOM 用量表 (多 Sheet)</h2>
        </div>
        <input type="file" id="fileBom" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 mb-2 cursor-pointer">
        <div id="bomSheetInfo" class="text-[11px] text-amber-600 font-medium hidden mb-1"></div>
        <div id="mappingBom" class="space-y-1.5 text-xs hidden mt-auto pt-2 border-t border-slate-100">
          <div><label class="text-slate-500 font-medium">主件料號欄位：</label><select id="col_bom_parent" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">元件/原物料料號：</label><select id="col_bom_child" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">單位組成用量：</label><select id="col_bom_qty" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
        </div>
      </div>

      <!-- 檔案 4: 新舊主件對照表 -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col">
        <div class="flex items-center gap-2 mb-2">
          <span class="w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold">4</span>
          <h2 class="font-semibold text-sm text-slate-800">新舊主件對照檔</h2>
        </div>
        <input type="file" id="fileMap" accept=".xlsx, .xls, .csv" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 mb-2 cursor-pointer">
        <div id="mapSheetInfo" class="text-[11px] text-emerald-600 font-medium hidden mb-1"></div>
        <div id="mappingMap" class="space-y-1.5 text-xs hidden mt-auto pt-2 border-t border-slate-100">
          <div><label class="text-slate-500 font-medium">舊主件料號：</label><select id="col_map_old" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">新主件料號：</label><select id="col_map_new" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
          <div><label class="text-slate-500 font-medium">新主件品名規格：</label><select id="col_map_name" class="w-full mt-0.5 border rounded p-1 bg-slate-50"></select></div>
        </div>
      </div>
    </div>

    <!-- 運算控制與篩選 -->
    <div class="flex flex-col md:flex-row items-center justify-center gap-4">
      <div class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl border border-slate-200 text-sm shadow-sm">
        <span class="text-slate-600 font-medium">核價變動過濾：</span>
        <select id="priceFilterType" class="border border-slate-300 rounded px-2 py-1 bg-slate-50 font-medium text-slate-700">
          <option value="ALL">全部變動 (包含降價與調漲)</option>
          <option value="UP" selected>僅看調漲 (差價 &gt; 0)</option>
          <option value="DOWN">僅看降價 (差價 &lt; 0)</option>
        </select>
      </div>
      <button id="calcBtn" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md transition transform active:scale-95">
        🚀 開始計算物料變動衝擊
      </button>
    </div>

    <!-- 統計數據卡片 -->
    <div id="statsSection" class="grid grid-cols-1 md:grid-cols-4 gap-4 hidden">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">波及主件總數</div>
        <div id="statTotalProducts" class="text-2xl font-bold text-slate-800 mt-1">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">單台成本最大漲幅</div>
        <div id="statMaxUp" class="text-2xl font-bold text-rose-600 mt-1">+$0.00</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">單台成本最大降幅</div>
        <div id="statMaxDown" class="text-2xl font-bold text-emerald-600 mt-1">-$0.00</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500">未對照新料號主件數</div>
        <div id="statUnmapped" class="text-2xl font-bold text-amber-500 mt-1">0</div>
      </div>
    </div>

    <!-- 結果表格 -->
    <div id="resultCard" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden hidden">
      <div class="p-4 border-b border-slate-200 flex flex-col md:flex-row justify-between items-center gap-3">
        <h2 class="font-bold text-slate-800">受調價影響之成品主件列表</h2>
        <div class="flex items-center gap-2 w-full md:w-auto">
          <input type="text" id="searchInput" placeholder="搜尋新舊料號、品名..." class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64">
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
              <th class="p-3 w-12 text-center">明細</th>
              <th class="p-3">新系統主件料號</th>
              <th class="p-3">新主件品名規格</th>
              <th class="p-3">對應舊主件</th>
              <th class="p-3 text-center">波及原物料數</th>
              <th class="p-3 text-right">單台成本變動 (ΔCost)</th>
              <th class="p-3 text-center">警戒 / 處置建議</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let rawPriceData = [], rawStockData = [], rawBomData = [], rawMapData = [];
    let calculatedResults = [];

    // 💡 核心標準化函數：統一轉大寫並剥除開頭的 W- 或 w-
    function normalizeCode(code) {
      if (!code) return '';
      return String(code).trim().toUpperCase().replace(/^W-/, '');
    }

    // 💡 雙重鍵值查詢輔助函數：先比對原碼，比不到再比對去掉 W- 的標準碼
    function getFromFlexibleMap(map, rawCode) {
      const cleanRaw = String(rawCode || '').trim().toUpperCase();
      if (!cleanRaw) return undefined;
      if (map.has(cleanRaw)) return map.get(cleanRaw);
      const norm = normalizeCode(cleanRaw);
      if (map.has(norm)) return map.get(norm);
      return undefined;
    }

    // 💡 雙重鍵值寫入輔助函數：同時註冊原碼與去掉 W- 的標準碼
    function setToFlexibleMap(map, rawCode, value) {
      const cleanRaw = String(rawCode || '').trim().toUpperCase();
      if (!cleanRaw) return;
      map.set(cleanRaw, value);
      const norm = normalizeCode(cleanRaw);
      if (norm && !map.has(norm)) {
        map.set(norm, value);
      }
    }

    function handleFileUpload(file, readAllSheets, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        if (!readAllSheets) {
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
          callback(json, [workbook.SheetNames[0]]);
        } else {
          let combinedRows = [];
          const sheetNames = workbook.SheetNames;
          
          sheetNames.forEach((sheetName, sIndex) => {
            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            if (rows && rows.length > 0) {
              if (sIndex === 0) {
                const header = [...rows[0], "__SHEET_NAME__"];
                combinedRows.push(header);
              }
              for (let r = 1; r < rows.length; r++) {
                if (rows[r] && rows[r].length > 0) {
                  const newRow = [...rows[r]];
                  newRow.push(sheetName);
                  combinedRows.push(newRow);
                }
              }
            }
          });
          callback(combinedRows, sheetNames);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function populateDropdown(selectId, headers, keywords) {
      const select = document.getElementById(selectId);
      select.innerHTML = '<option value="">-- 請選擇欄位 --</option>';
      let matchedIndex = -1;

      headers.forEach((h, index) => {
        if (h === undefined || h === null) return;
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${String(h).trim()} (欄位 ${index + 1})`;
        select.appendChild(opt);

        const cleanH = String(h).replace(/\s+/g, '').toLowerCase();
        if (matchedIndex === -1 && keywords.some(k => cleanH.includes(k))) {
          matchedIndex = index;
        }
      });

      if (matchedIndex !== -1) select.value = matchedIndex;
    }

    // 1. 採購核價單
    document.getElementById('filePrice').addEventListener('change', (e) => {
      handleFileUpload(e.target.files[0], false, (rows) => {
        rawPriceData = rows;
        const headers = rows[0] || [];
        populateDropdown('col_rm_no', headers, ['品號', '料號', '物料']);
        populateDropdown('col_old_price', headers, ['原單價', '上次']);
        populateDropdown('col_new_price', headers, ['單價', '本次']);
        document.getElementById('priceSheetInfo').textContent = `✅ 已讀取 ${rows.length - 1} 筆核價料件`;
        document.getElementById('priceSheetInfo').classList.remove('hidden');
        document.getElementById('mappingPrice').classList.remove('hidden');
      });
    });

    // 2. 庫存單價表
    document.getElementById('fileStock').addEventListener('change', (e) => {
      handleFileUpload(e.target.files[0], false, (rows) => {
        rawStockData = rows;
        const headers = rows[0] || [];
        populateDropdown('col_stock_no', headers, ['品號', '料號', '物料']);
        populateDropdown('col_stock_price', headers, ['庫存單價', '單價', '成本', '平均單價']);
        document.getElementById('stockSheetInfo').textContent = `✅ 已讀取 ${rows.length - 1} 筆庫存單價基準`;
        document.getElementById('stockSheetInfo').classList.remove('hidden');
        document.getElementById('mappingStock').classList.remove('hidden');
      });
    });

    // 3. BOM 用量表
    document.getElementById('fileBom').addEventListener('change', (e) => {
      handleFileUpload(e.target.files[0], true, (rows, sheetNames) => {
        rawBomData = rows;
        const headers = rows[0] || [];
        populateDropdown('col_bom_parent', headers, ['主件品號', '主件', '主料', '母件']);
        populateDropdown('col_bom_child', headers, ['元件品號', '元件', '子件']);
        populateDropdown('col_bom_qty', headers, ['組成用量', '組合用量', '單位用量', '用量']);
        document.getElementById('bomSheetInfo').textContent = `✅ 成功整合 ${sheetNames.length} 個工作表，共 ${rows.length - 1} 筆 BOM`;
        document.getElementById('bomSheetInfo').classList.remove('hidden');
        document.getElementById('mappingBom').classList.remove('hidden');
      });
    });

    // 4. 新舊對照表
    document.getElementById('fileMap').addEventListener('change', (e) => {
      handleFileUpload(e.target.files[0], false, (rows) => {
        rawMapData = rows;
        const headers = rows[0] || [];
        populateDropdown('col_map_old', headers, ['來源參考料號', '舊料號', '舊']);
        populateDropdown('col_map_new', headers, ['料號', '新料號', '新']);
        populateDropdown('col_map_name', headers, ['品名', '規格']);
        document.getElementById('mapSheetInfo').textContent = `✅ 已讀取 ${rows.length - 1} 筆對照資料`;
        document.getElementById('mapSheetInfo').classList.remove('hidden');
        document.getElementById('mappingMap').classList.remove('hidden');
      });
    });

    function runAnalysis() {
      const idxRm = document.getElementById('col_rm_no').value;
      const idxOldP = document.getElementById('col_old_price').value;
      const idxNewP = document.getElementById('col_new_price').value;

      const idxStockRm = document.getElementById('col_stock_no').value;
      const idxStockPrice = document.getElementById('col_stock_price').value;

      const idxParent = document.getElementById('col_bom_parent').value;
      const idxChild = document.getElementById('col_bom_child').value;
      const idxQty = document.getElementById('col_bom_qty').value;

      const idxMapOld = document.getElementById('col_map_old').value;
      const idxMapNew = document.getElementById('col_map_new').value;
      const idxMapName = document.getElementById('col_map_name').value;

      const filterType = document.getElementById('priceFilterType').value;

      if (!idxRm || !idxOldP || !idxNewP || !idxChild || !idxQty || !idxMapOld || !idxMapNew) {
        alert('請確認：核價單、BOM表、新舊對照檔的必備欄位皆已選定！');
        return;
      }

      // 1. 建立期末庫存單價 Map (支援 W- 雙重鍵值)
      const stockPriceMap = new Map();
      if (rawStockData.length > 1 && idxStockRm !== "" && idxStockPrice !== "") {
        for (let i = 1; i < rawStockData.length; i++) {
          const row = rawStockData[i];
          const sCode = String(row[idxStockRm] || '').trim();
          const sPrice = parseFloat(row[idxStockPrice]) || 0;
          if (sCode) {
            setToFlexibleMap(stockPriceMap, sCode, sPrice);
          }
        }
      }

      // 2. 整理核價資料 (支援 W- 雙重鍵值)
      const priceDiffMap = new Map();
      for (let i = 1; i < rawPriceData.length; i++) {
        const row = rawPriceData[i];
        const rmCode = String(row[idxRm] || '').trim();
        const oldP = parseFloat(row[idxOldP]) || 0;
        const newP = parseFloat(row[idxNewP]) || 0;
        
        if (!rmCode || newP <= 0) continue;

        const stockP = getFromFlexibleMap(stockPriceMap, rmCode);
        const hasStock = stockP !== undefined;

        let basePrice = oldP;
        let baseType = '上次單價';

        if (oldP === 0 && hasStock && stockP > 0) {
          basePrice = stockP;
          baseType = '庫存參考價';
        } else if (oldP > 0) {
          basePrice = oldP;
          baseType = '上次單價';
        } else {
          basePrice = 0;
          baseType = '初次核價(無基準)';
        }

        const diff = newP - basePrice;

        if (filterType === 'UP' && diff <= 0) continue;
        if (filterType === 'DOWN' && diff >= 0) continue;
        if (filterType === 'ALL' && diff === 0) continue;

        setToFlexibleMap(priceDiffMap, rmCode, {
          oldPrice: oldP,
          stockPrice: hasStock ? stockP : null,
          newPrice: newP,
          basePrice: basePrice,
          baseType: baseType,
          diff: diff
        });
      }

      // 3. 建立新舊成品對照 Map (自動兼容有無 W- / w-)
      const productMap = new Map();
      for (let i = 1; i < rawMapData.length; i++) {
        const row = rawMapData[i];
        const oldCode = String(row[idxMapOld] || '').trim();
        const newCode = String(row[idxMapNew] || '').trim();
        const newName = idxMapName !== "" ? String(row[idxMapName] || '').trim() : '未命名規格';

        if (oldCode) {
          setToFlexibleMap(productMap, oldCode, {
            newCode: newCode || '未對照',
            newName: newName
          });
        }
      }

      // 4. 處理 BOM
      const summaryMap = new Map();
      const lastColIdx = (rawBomData[0] || []).length - 1;
      let currentParent = '';

      for (let i = 1; i < rawBomData.length; i++) {
        const row = rawBomData[i];
        let parentVal = idxParent !== "" ? String(row[idxParent] || '').trim() : '';
        const childCode = String(row[idxChild] || '').trim();
        const qty = parseFloat(row[idxQty]) || 0;
        const sheetNameFallback = String(row[lastColIdx] || '').trim();

        if (parentVal) {
          currentParent = parentVal;
        } else if (!currentParent && sheetNameFallback) {
          currentParent = sheetNameFallback;
        }

        if (!childCode || qty <= 0 || !currentParent) continue;

        // 雙重查詢核價資料 (可同時匹配有無 W- 的元件料號)
        const rmInfo = getFromFlexibleMap(priceDiffMap, childCode);
        if (rmInfo) {
          const impact = rmInfo.diff * qty;

          if (!summaryMap.has(currentParent)) {
            // 雙重查詢新舊主件對照 (可同時匹配有無 W- 的主件料號，例如 W-R248065R 匹配 R248065R)
            const mappedProd = getFromFlexibleMap(productMap, currentParent) || {
              newCode: '【未建立對照】',
              newName: '查無新系統對照品名'
            };
            summaryMap.set(currentParent, {
              oldParent: currentParent,
              newParent: mappedProd.newCode,
              newName: mappedProd.newName,
              totalCostIncrease: 0,
              materials: []
            });
          }

          const target = summaryMap.get(currentParent);
          target.totalCostIncrease += impact;
          target.materials.push({
            rmCode: childCode,
            oldPrice: rmInfo.oldPrice,
            stockPrice: rmInfo.stockPrice,
            newPrice: rmInfo.newPrice,
            basePrice: rmInfo.basePrice,
            baseType: rmInfo.baseType,
            diff: rmInfo.diff,
            qty: qty,
            impact: impact
          });
        }
      }

      calculatedResults = Array.from(summaryMap.values());
      calculatedResults.sort((a, b) => b.totalCostIncrease - a.totalCostIncrease);

      renderResults();
    }

    function renderResults() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      let totalAffected = 0;
      let maxUp = 0;
      let maxDown = 0;
      let unmappedCount = 0;

      calculatedResults.forEach((item, index) => {
        const matchSearch = item.newParent.toLowerCase().includes(searchVal) ||
                            item.oldParent.toLowerCase().includes(searchVal) ||
                            item.newName.toLowerCase().includes(searchVal);

        if (item.newParent.includes('未建立對照')) unmappedCount++;
        if (item.totalCostIncrease > maxUp) maxUp = item.totalCostIncrease;
        if (item.totalCostIncrease < maxDown) maxDown = item.totalCostIncrease;
        totalAffected++;

        if (!matchSearch) return;

        let badge = '';
        if (item.totalCostIncrease > 3.0) {
          badge = '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-rose-100 text-rose-800 animate-pulse">🚨 高衝擊需調價</span>';
        } else if (item.totalCostIncrease > 0) {
          badge = '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-800">⚠️ 成本調漲</span>';
        } else {
          badge = '<span class="px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800">📉 成本降價</span>';
        }

        const isUp = item.totalCostIncrease > 0;
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition border-b border-slate-100 cursor-pointer";
        tr.onclick = () => toggleDetail(index);
        tr.innerHTML = `
          <td class="p-3 text-center text-slate-400 font-bold" id="icon-${index}">▶</td>
          <td class="p-3 font-semibold ${item.newParent.includes('未建立') ? 'text-amber-600' : 'text-blue-600'}">${item.newParent}</td>
          <td class="p-3 text-slate-700">${item.newName}</td>
          <td class="p-3 font-mono text-slate-500">${item.oldParent}</td>
          <td class="p-3 text-center"><span class="px-2 py-0.5 bg-slate-100 rounded-full text-xs font-medium">${item.materials.length} 顆</span></td>
          <td class="p-3 text-right font-mono font-bold ${isUp ? 'text-rose-600' : 'text-emerald-600'}">${isUp ? '+' : ''}$${item.totalCostIncrease.toFixed(4)}</td>
          <td class="p-3 text-center">${badge}</td>
        `;
        tbody.appendChild(tr);

        const trDetail = document.createElement('tr');
        trDetail.id = `detail-${index}`;
        trDetail.className = "hidden bg-slate-50 border-b border-slate-200";
        
        let subRows = item.materials.map(m => {
          const stockText = m.stockPrice !== null ? `$${m.stockPrice.toFixed(4)}` : '<span class="text-slate-300">--</span>';
          const isStockBase = m.baseType === '庫存參考價';
          
          return `
            <tr class="border-b border-slate-200 text-xs text-slate-600">
              <td class="p-2 font-mono font-medium text-slate-700">${m.rmCode}</td>
              <td class="p-2 text-right font-mono ${isStockBase ? 'text-purple-700 font-semibold' : 'text-slate-500'}">${stockText}</td>
              <td class="p-2 text-right font-mono ${m.oldPrice === 0 ? 'text-slate-400' : ''}">$${m.oldPrice.toFixed(4)}</td>
              <td class="p-2 text-right font-mono font-bold text-slate-800">$${m.newPrice.toFixed(4)}</td>
              <td class="p-2 text-center">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${isStockBase ? 'bg-purple-100 text-purple-800' : 'bg-slate-100 text-slate-600'}">
                  ${m.baseType}
                </span>
              </td>
              <td class="p-2 text-right font-mono font-semibold ${m.diff > 0 ? 'text-rose-600' : 'text-emerald-600'}">
                ${m.diff > 0 ? '+' : ''}$${m.diff.toFixed(4)}
              </td>
              <td class="p-2 text-center">${m.qty}</td>
              <td class="p-2 text-right font-mono font-bold text-slate-900">
                ${m.impact > 0 ? '+' : ''}$${m.impact.toFixed(4)}
              </td>
            </tr>
          `;
        }).join('');

        trDetail.innerHTML = `
          <td colspan="7" class="p-4">
            <div class="bg-white rounded-lg border border-slate-200 p-3 shadow-inner">
              <div class="text-xs font-bold text-slate-700 mb-2">波及變動原物料明細：</div>
              <table class="w-full text-left">
                <thead>
                  <tr class="text-xs text-slate-400 border-b border-slate-200">
                    <th class="p-1">原物料料號</th>
                    <th class="p-1 text-right">期末庫存單價</th>
                    <th class="p-1 text-right">上次採購單價</th>
                    <th class="p-1 text-right">本次核定單價</th>
                    <th class="p-1 text-center">計算基準</th>
                    <th class="p-1 text-right">有效差價</th>
                    <th class="p-1 text-center">單位用量</th>
                    <th class="p-1 text-right">單件成本影響</th>
                  </tr>
                </thead>
                <tbody>${subRows}</tbody>
              </table>
            </div>
          </td>
        `;
        tbody.appendChild(trDetail);
      });

      document.getElementById('statTotalProducts').textContent = totalAffected;
      document.getElementById('statMaxUp').textContent = `+$${maxUp.toFixed(2)}`;
      document.getElementById('statMaxDown').textContent = `-$${Math.abs(maxDown).toFixed(2)}`;
      document.getElementById('statUnmapped').textContent = unmappedCount;

      document.getElementById('statsSection').classList.remove('hidden');
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('exportBtn').disabled = false;
    }

    function toggleDetail(index) {
      const detailRow = document.getElementById(`detail-${index}`);
      const icon = document.getElementById(`icon-${index}`);
      if (detailRow.classList.contains('hidden')) {
        detailRow.classList.remove('hidden');
        icon.textContent = '▼';
      } else {
        detailRow.classList.add('hidden');
        icon.textContent = '▶';
      }
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (calculatedResults.length === 0) return;
      const wb = XLSX.utils.book_new();

      const summaryRows = calculatedResults.map(p => {
        let suggestion = '成本持平';
        if (p.totalCostIncrease > 3.0) suggestion = '🚨 高度警戒：強制重新核定客戶報價';
        else if (p.totalCostIncrease > 0) suggestion = '⚠️ 成本調漲：評估業務議價空間';
        else if (p.totalCostIncrease < 0) suggestion = '📉 成本降低：可作為接單價格優勢';

        return {
          '新系統主件料號': p.newParent,
          '新主件品名規格': p.newName,
          '舊系統主件料號': p.oldParent,
          '單台總成本變動額 (ΔCost)': Number(p.totalCostIncrease.toFixed(4)),
          '波及原物料項目數': p.materials.length,
          '趨勢狀態': p.totalCostIncrease > 0 ? '調漲' : '調降',
          '管理者建議處置': suggestion
        };
      });
      const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
      XLSX.utils.book_append_sheet(wb, wsSummary, "主件衝擊匯總(決策用)");

      const detailRows = [];
      calculatedResults.forEach(prod => {
        prod.materials.forEach(mat => {
          detailRows.push({
            '新主件料號': prod.newParent,
            '新主件品名規格': prod.newName,
            '舊主件料號': prod.oldParent,
            '原物料料號': mat.rmCode,
            '期末庫存單價': mat.stockPrice !== null ? mat.stockPrice : '--',
            '上次原採購價': mat.oldPrice,
            '本次核定單價': mat.newPrice,
            '計算採用基準': mat.baseType,
            '有效差價': Number(mat.diff.toFixed(4)),
            'BOM單位用量': mat.qty,
            '單件成本衝擊金額': Number(mat.impact.toFixed(4)),
            '變動方向': mat.diff > 0 ? '漲' : '跌'
          });
        });
      });
      const wsDetail = XLSX.utils.json_to_sheet(detailRows);
      XLSX.utils.book_append_sheet(wb, wsDetail, "衝擊明細追溯(業務採購用)");

      const unmappedRows = calculatedResults
        .filter(p => p.newParent.includes('未建立對照'))
        .map(p => ({
          '舊主件料號': p.oldParent,
          '波及調價原物料數': p.materials.length,
          '單台總成本影響': Number(p.totalCostIncrease.toFixed(4)),
          '待辦事項': '請確認新系統對應料號並補入對照檔'
        }));

      if (unmappedRows.length > 0) {
        const wsUnmapped = XLSX.utils.json_to_sheet(unmappedRows);
        XLSX.utils.book_append_sheet(wb, wsUnmapped, "待補新料號清單(MIS用)");
      }

      const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      XLSX.writeFile(wb, `原物料調價_成品成本衝擊管理報表_${today}.xlsx`);
    });

    document.getElementById('calcBtn').addEventListener('click', runAnalysis);
    document.getElementById('searchInput').addEventListener('input', renderResults);
    document.getElementById('priceFilterType').addEventListener('change', runAnalysis);
  </script>
</body>
</html>
